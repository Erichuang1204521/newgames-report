<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OH VNG Build Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a release ledger — sticky quick-links strip, then one row per build, newest first, version number as the left rail */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#18202b; --muted:#5d6878; --line:#dde2e9;
  --accent:#2c5d8f; --accent-soft:#e3ecf6;
  --vn:#b42318; --vn-soft:#fde7e5; --sea:#1d5fbf; --sea-soft:#e2edfc;
  --ok:#2f7a3b; --ok-soft:#e4f3e6; --warn:#a15c00; --warn-soft:#fdf0dc; --dim:#7a8494; --dim-soft:#eef0f3;
  --f-body:"IBM Plex Sans","IBM Plex Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11161d; --surface:#18202a; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2a3542;
    --accent:#7fb0e3; --accent-soft:#1f3349;
    --vn:#ff8a7e; --vn-soft:#3a1d1b; --sea:#7fb3ff; --sea-soft:#182c47;
    --ok:#7fcf8b; --ok-soft:#1b3121; --warn:#f0b35a; --warn-soft:#3a2a12; --dim:#8b96a6; --dim-soft:#222b36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11161d; --surface:#18202a; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2a3542;
  --accent:#7fb0e3; --accent-soft:#1f3349;
  --vn:#ff8a7e; --vn-soft:#3a1d1b; --sea:#7fb3ff; --sea-soft:#182c47;
  --ok:#7fcf8b; --ok-soft:#1b3121; --warn:#f0b35a; --warn-soft:#3a2a12; --dim:#8b96a6; --dim-soft:#222b36;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:980px;margin:0 auto;padding-block:32px 56px;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(26px,4vw,34px);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.qlink{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--bg)}
.qlink:hover{border-color:var(--accent)}
.qlink b{font-weight:600;color:var(--accent)}
.qlink span{font-size:13px;color:var(--muted)}
.pkg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.pkg code{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);background:var(--dim-soft);padding:1px 6px;border-radius:4px}
.ledger{display:flex;flex-direction:column;gap:14px}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.ledger-head h2{margin:0;font-size:20px;font-weight:600}
.ledger-head p{margin:0;font-size:13px;color:var(--muted)}
.build{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.build.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rail{padding:18px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ver{font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:-.02em}
.date{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{align-self:flex-start;max-width:100%;font-size:12px;font-weight:600;line-height:1.35;padding:3px 8px;border-radius:8px;white-space:normal;overflow-wrap:anywhere}
.t-live{background:var(--accent-soft);color:var(--accent)}
.t-green{background:var(--ok-soft);color:var(--ok)}
.t-skip{background:var(--dim-soft);color:var(--dim)}
.body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.body li{max-width:72ch}
.note{margin:0;font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{opacity:.9;color:var(--surface)}
.btn small{font-family:var(--f-mono);font-size:11px;color:inherit;opacity:.75}
.bugs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.bugs .lbl{color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
.c-open{background:var(--warn-soft);color:var(--warn)}
.c-fixed{background:var(--ok-soft);color:var(--ok)}
.c-nf{background:var(--vn-soft);color:var(--vn)}
.c-total{background:var(--dim-soft);color:var(--ink)}
.c-vn{background:var(--vn-soft);color:var(--vn);font-weight:700}
.c-sea{background:var(--sea-soft);color:var(--sea);font-weight:700}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:640px){
  .build{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  .ver{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.err{color:var(--vn)}
.wrap{max-width:1180px}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px}
.toc h2{margin:0 0 8px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);border-left:2px solid transparent}
.toc a:hover{background:var(--bg)}
.toc a.on{background:var(--accent-soft);border-left-color:var(--accent)}
.toc .tv{font-family:var(--f-mono);font-weight:700;font-size:13.5px}
.toc .td{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:4px;vertical-align:middle}
.toc .skip .tv{color:var(--dim);font-weight:500}
.build{scroll-margin-top:16px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:16px}
  .toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;max-height:none;padding:8px;border-radius:8px}
  .toc h2{display:none}
  .toc ol{flex-direction:row;overflow-x:auto;gap:6px}
  .toc a{flex:0 0 auto;border-left:0;border:1px solid var(--line)}
  .toc .td{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="eyebrow">Overgeared Hero VNG · C31 VN / C32 SEA</div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button><button type="button" data-lang="vi">Tiếng Việt</button>
      </div>
    </div>
    <h1 data-t="h1"></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <div class="layout">
    <nav class="toc" aria-labelledby="toch"><h2 id="toch" data-t="toc"></h2><ol id="toc"></ol></nav>
    <section class="ledger" aria-labelledby="l">
      <div class="ledger-head"><h2 id="l" data-t="ledger"></h2><p id="asof"></p></div>
      <div class="ledger" id="builds"></div>
    </section>
  </div>

  <footer>
    <span data-t="f1"></span>
    <span id="f2"></span>
    <span data-t="f3"></span>
  </footer>
</div>
<script>
let io=null;
function spy(){
  if(io) io.disconnect();
  const links=[...document.querySelectorAll("#toc a")];
  const set=v=>links.forEach(a=>{const on=a.dataset.v===v; a.classList.toggle("on",on); if(on){a.setAttribute("aria-current","true"); if(innerWidth<=860) a.scrollIntoView({block:"nearest",inline:"nearest"});} else a.removeAttribute("aria-current");});
  io=new IntersectionObserver(es=>{const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top); if(vis[0]) set(vis[0].target.id.slice(2));},{rootMargin:"0px 0px -65% 0px"});
  document.querySelectorAll(".build").forEach(el=>io.observe(el));
  if(links[0]) set(links[0].dataset.v);
}
const UI = {
  zh:{h1:"OH VNG 版本与 Buglist 总览",lede:"每个研发构建一行：在哪下载、改了什么、bug 记在哪张表。Bug 本身仍然记在 Google 在线表里，这里只做入口汇总。",
      toc:"版本索引",ledger:"构建记录",asof:d=>"新版本在上 · 更新于 "+d,download:"下载包",notes:"版本说明",bugs:"Buglist",folder:"构建文件夹",
      bug:"Bug",total:"共",fixed:"Fixed",open:"Open",nf:"Not Fixed",
      f1:"版号包（0.0.1 – 0.0.2.3）的 bug 都记在同一张表「VN License Build_0.0.1_Feedback」里，每个版本一个页签。",
      f2:u=>"研发文件夹里的「0.0.0」是服务器搭建包（11/06 交付给 VNG 搭环境用），不是客户端构建：<a href=\""+u+"\" target=\"_blank\" rel=\"noopener\">0.0.0 文件夹</a>。",
      f3:"链接需要有对应 Drive 文件的访问权限才能打开。",err:"数据加载失败，请刷新重试。",title:"OH VNG 版本总览"},
  en:{h1:"OH VNG Builds & Buglists",lede:"One row per developer build: where to download it, what changed, and which sheet tracks its bugs. Bugs are still logged in Google Sheets; this page only gathers the links.",
      toc:"Versions",ledger:"Build history",asof:d=>"Newest first · updated "+d,download:"Download",notes:"Release notes",bugs:"Buglist",folder:"Build folder",
      bug:"Bugs",total:"Total",fixed:"Fixed",open:"Open",nf:"Not Fixed",
      f1:"Bugs for the license builds (0.0.1 – 0.0.2.3) are all in one sheet, \"VN License Build_0.0.1_Feedback\", with one tab per build.",
      f2:u=>"The \"0.0.0\" folder in the developer's Drive is the server setup package (delivered 11/06 for VNG to build the environment), not a client build: <a href=\""+u+"\" target=\"_blank\" rel=\"noopener\">0.0.0 folder</a>.",
      f3:"Links open only for people with access to the Drive files.",err:"Couldn't load the data. Please refresh.",title:"OH VNG Build Log"},
  vi:{h1:"Tổng hợp phiên bản & Buglist OH VNG",lede:"Mỗi build của nhà phát triển là một dòng: tải ở đâu, thay đổi gì, bug ghi ở bảng nào. Bug vẫn được ghi trong Google Sheets; trang này chỉ tập hợp đường dẫn.",
      toc:"Phiên bản",ledger:"Lịch sử build",asof:d=>"Mới nhất ở trên · cập nhật "+d,download:"Tải bản build",notes:"Ghi chú phát hành",bugs:"Buglist",folder:"Thư mục build",
      bug:"Bug",total:"Tổng",fixed:"Fixed",open:"Open",nf:"Not Fixed",
      f1:"Bug của các bản giấy phép (0.0.1 – 0.0.2.3) đều nằm trong một bảng \"VN License Build_0.0.1_Feedback\", mỗi phiên bản một tab.",
      f2:u=>"Thư mục \"0.0.0\" trên Drive của nhà phát triển là gói dựng server (giao ngày 06/11 để VNG dựng môi trường), không phải bản client: <a href=\""+u+"\" target=\"_blank\" rel=\"noopener\">thư mục 0.0.0</a>.",
      f3:"Chỉ người có quyền truy cập tệp Drive tương ứng mới mở được các đường dẫn.",err:"Không tải được dữ liệu. Vui lòng tải lại trang.",title:"Tổng hợp build OH VNG"}
};
const LANGS=["zh","en","vi"], HTML_LANG={zh:"zh-CN",en:"en",vi:"vi"};
let data=null, lang=pickLang();

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(LANGS.includes(q)) return q;
  try{const s=localStorage.getItem("ohLang"); if(LANGS.includes(s)) return s;}catch(e){}
  const n=(navigator.language||"").toLowerCase();
  return n.startsWith("vi")?"vi":n.startsWith("zh")?"zh":"en";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const tr=v=>v==null?"":(typeof v==="object"?(v[lang]??v.en??""):v);
const a=(url,cls,inner)=>`<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`;

function render(){
  const T=UI[lang];
  document.documentElement.lang=HTML_LANG[lang];
  document.title=T.title;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=T[el.dataset.t];});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  if(!data) return;
  document.getElementById("asof").textContent=T.asof(data.updated);
  document.getElementById("f2").innerHTML=T.f2(esc(data.serverPackage));
  document.getElementById("toc").innerHTML=data.builds.map(b=>`<li class="${b.kind==="skip"?"skip":""}"><a href="#v-${esc(b.ver)}" data-v="${esc(b.ver)}"><span class="tv">${esc(b.ver)}${b.current?'<span class="dot" aria-hidden="true"></span>':""}</span><span class="td">${esc(b.date.slice(5))}</span></a></li>`).join("");
  document.getElementById("builds").innerHTML=data.builds.map(b=>{
    const tagCls={live:"t-live",green:"t-green",skip:"t-skip"}[b.kind]||"t-skip";
    const items=(tr(b.items)||[]).map(i=>`<li>${esc(i)}</li>`).join("");
    const note=b.note?`<p class="note">${esc(tr(b.note))}</p>`:"";
    const links=(b.links||[]).map(l=>a(l.url,"btn"+(l.type==="download"?" primary":""),esc(T[l.type])+(l.sub?` <small>${esc(tr(l.sub))}</small>`:""))).join("");
    let bugs="";
    if(b.bugs){const g=b.bugs, c=[];
      c.push(`<span class="lbl">${esc(g.label?tr(g.label):T.bug)}</span>`);
      c.push(`<span class="chip c-total">${T.total} ${g.total}</span>`);
      if(g.vn!=null) c.push(`<span class="chip c-vn">VN ${g.vn}</span>`);
      if(g.sea!=null) c.push(`<span class="chip c-sea">SEA ${g.sea}</span>`);
      if(g.open) c.push(`<span class="chip c-open">${T.open} ${g.open}</span>`);
      if(g.fixed) c.push(`<span class="chip c-fixed">${T.fixed} ${g.fixed}</span>`);
      if(g.nf) c.push(`<span class="chip c-nf">${T.nf} ${g.nf}</span>`);
      if(g.extra) c.push(`<span class="lbl">${esc(tr(g.extra))}</span>`);
      bugs=`<div class="bugs">${c.join("")}</div>`;}
    return `<article class="build${b.current?" current":""}" id="v-${esc(b.ver)}">
      <div class="rail"><div class="ver">${esc(b.ver)}</div><div class="date">${esc(b.date)}</div><span class="tag ${tagCls}">${esc(tr(b.tag))}</span></div>
      <div class="body"><ul>${items}</ul>${note}<div class="links">${links}</div></div></article>`;
  }).join("");
  spy();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang; try{localStorage.setItem("ohLang",lang);}catch(e){}
  const u=new URL(location.href); u.searchParams.set("lang",lang); history.replaceState(null,"",u);
  render();
}));
render();
fetch("builds.json",{cache:"no-cache"}).then(r=>{if(!r.ok) throw 0; return r.json();})
  .then(j=>{data=j; render(); if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView();}})
  .catch(()=>{document.getElementById("builds").innerHTML=`<p class="err">${esc(UI[lang].err)}</p>`;});
</script>
</body>
</html>
